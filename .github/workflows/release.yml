name: Release

# Builds the prebuilt binaries that scripts/fetch-or-build.sh downloads on
# `herdr plugin install`: one `herdr-github-status-<target>` asset per platform plus a
# `.sha256` sidecar, attached to the GitHub Release for the pushed `vX.Y.Z` tag.

# Pull requests that touch the release machinery run the builds only (no publish), so a
# broken target is caught before a tag is pushed.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/**
      - Cargo.toml
      - Cargo.lock

permissions:
  contents: read

jobs:
  versions:
    name: tag matches manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check versions
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            sh scripts/check-versions.sh "$GITHUB_REF_NAME"
          else
            sh scripts/check-versions.sh
          fi

  build:
    name: ${{ matrix.target }}
    needs: versions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both macOS targets build on the Apple-silicon runner: GitHub has retired its
          # Intel macOS images, and cargo cross-compiles x86_64-apple-darwin with Xcode's
          # clang once the target is installed.
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build
        run: ${{ matrix.cross && 'cross' || 'cargo' }} build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          asset="herdr-github-status-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/herdr-github-status" "$asset"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
          cat "$asset.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: herdr-github-status-${{ matrix.target }}*
          if-no-files-found: error

  publish:
    name: attach to release
    needs: build
    # Publish whatever built: one broken target must not withhold the other platforms'
    # binaries (scripts/fetch-or-build.sh falls back to a source build for a missing one).
    if: github.ref_type == 'tag' && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The tag's release usually exists already (created by the release tooling with
      # notes); create a bare one only if it does not.
      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
