# herdr plugin manifest — see https://herdr.dev/docs/plugins/
#
# Install:  herdr plugin install jwanga/herdr-plugin-github-status
# Develop:  cargo build --release && herdr plugin link .
#
# The pane command runs the launcher by absolute path under $HERDR_PLUGIN_ROOT: pane
# commands resolve against the pane's cwd (the project), not the plugin root.
# herdr/launch.sh prefers bin/ and falls back to target/release/. On `plugin install` the
# [[build]] step fills bin/: the prebuilt release binary for this version and platform
# (SHA-256 verified), else a `cargo build --release`. Keep `version` equal to Cargo.toml's
# (CI checks); the release tag is `v<version>`.

id = "jwanga.github-status"
name = "GitHub Status"
version = "0.1.0"
min_herdr_version = "0.8.0"
platforms = ["macos", "linux"]
description = "Real-time project status pane: GitHub milestones, issues, pull requests, and Actions, docked on the right at sidebar width."

[[build]]
command = ["sh", "scripts/fetch-or-build.sh"]

[[panes]]
id = "status"
title = "status"
placement = "split"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/herdr/launch.sh\""]

[[actions]]
id = "toggle"
title = "GitHub Status: toggle pane"
description = "Open the status pane on the right of this tab, or close it if it is already open."
contexts = ["workspace", "pane"]
command = ["bash", "herdr/pane.sh", "toggle"]

[[actions]]
id = "open"
title = "GitHub Status: open pane"
description = "Open the status pane on the right of this tab (focus it if already open)."
contexts = ["workspace", "pane"]
command = ["bash", "herdr/pane.sh", "open"]

[[actions]]
id = "close"
title = "GitHub Status: close pane"
description = "Close every status pane in this workspace."
contexts = ["workspace", "pane"]
command = ["bash", "herdr/pane.sh", "close"]

# Auto-dock: keep a status pane in every tab. `dock ensure` is idempotent, locks per tab,
# never takes focus, and leaves a tab alone once its pane has been closed (toggle reopens).
[[events]]
on = "workspace.created"
command = ["bash", "herdr/pane.sh", "ensure"]

[[events]]
on = "tab.created"
command = ["bash", "herdr/pane.sh", "ensure"]

[[events]]
on = "tab.focused"
command = ["bash", "herdr/pane.sh", "ensure"]

[[events]]
on = "pane.focused"
command = ["bash", "herdr/pane.sh", "ensure"]

# After a herdr restart, forget docked panes that were not restored so their tabs dock again.
[[startup]]
command = ["bash", "herdr/pane.sh", "startup"]
